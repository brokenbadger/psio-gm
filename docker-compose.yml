# PSIO-GM — Docker Compose (supported run path)
#
#   mkdir -p games
#   docker compose up --build
#   Open http://127.0.0.1:5000 — library path is prefilled as /games
#
# Custom games folder (prefer ./relative or absolute path):
#   PSIO_GAMES_DIR=./psio_games_test_folder docker compose up --build
#   PSIO_GAMES_DIR=/home/you/ps1/games docker compose up --build

name: psio-gm

services:
  psio-gm:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: psio-gm-app:0.2.2
    container_name: psio-gm
    environment:
      PSIO_LIBRARY_ROOT: /games
      PSIO_DEFAULT_LIBRARY: /games
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - type: bind
        source: ${PSIO_GAMES_DIR:-./games}
        target: /games
        bind:
          create_host_path: true
    working_dir: /app/src
    command: ["python", "-m", "webapp", "--host", "0.0.0.0", "--port", "5000"]
