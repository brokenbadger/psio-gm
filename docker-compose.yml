# PSIO-GM — Docker Compose (supported run path)
#
#   docker compose up --build -d
#   Open http://127.0.0.1:5000 — Scan / Process (library is ./games → /games)
#   (./games is bind-mounted and created on the host if missing)
#   Stop with: docker compose down
#
# Run as the host user so processed game folders are not root-owned.
# Pass the current user's IDs (any account on any machine):
#   PUID=$(id -u) PGID=$(id -g) docker compose up --build -d
#
# Custom games folder (prefer ./relative or absolute path):
#   PSIO_GAMES_DIR=/home/you/ps1/games docker compose up --build -d

name: psio-gm

services:
  psio-gm:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: psio-gm-app:0.2.2
    container_name: psio-gm
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      PSIO_LIBRARY_ROOT: /games
      PSIO_DEFAULT_LIBRARY: /games
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - type: bind
        source: ${PSIO_GAMES_DIR:-./games}
        target: /games
        bind:
          create_host_path: true
    working_dir: /app/src
    command: ["python", "-m", "webapp", "--host", "0.0.0.0", "--port", "5000"]
