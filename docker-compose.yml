# PSIO-GM Docker Compose
#
# This is a Tkinter GUI app and needs a host display (X11).
# A local Python venv is still the simpler option for most users.
#
# Linux (X11):
#   mkdir -p games   # or set PSIO_GAMES_DIR to your library
#   xhost +local:docker
#   PSIO_GAMES_DIR=/path/to/your/ps1/games docker compose up --build
#
# Then Browse to /games inside the app (or a subdirectory under it).
#
# Stop access when finished:
#   xhost -local:docker

name: psio-gm

services:
  psio-gm:
    build: .
    image: psio-gm-app
    container_name: psio-gm
    environment:
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /root/.Xauthority
    volumes:
      # X11 socket + auth cookie for the GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/root/.Xauthority:ro
      # Your PS1 game library (override with PSIO_GAMES_DIR)
      - ${PSIO_GAMES_DIR:-./games}:/games:rw
    working_dir: /app/src
    # Shared memory helps Tk/X11 avoid rendering glitches
    ipc: host
    stdin_open: true
    tty: true
