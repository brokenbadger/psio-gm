name: Update Docker Hub overview

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]*"

jobs:
  overview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: peter-evans/dockerhub-description@v5
        with:
          username: brokenbadger
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: brokenbadger/psio-gm
          short-description: Prepare PlayStation 1 bin/cue games for a PSIO device.
          readme-filepath: ./docker/hub-overview.md
