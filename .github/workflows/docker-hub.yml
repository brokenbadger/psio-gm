name: Publish Docker image

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: brokenbadger
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: brokenbadger/psio-gm:stable

      - name: Remove Docker Hub tags other than stable
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          jwt=$(jq -n --arg u brokenbadger --arg p "$DOCKERHUB_TOKEN" '{username:$u,password:$p}' \
            | curl -fsS -H 'Content-Type: application/json' -d @- https://hub.docker.com/v2/users/login/ \
            | jq -r .token)
          test -n "$jwt" && test "$jwt" != "null"
          url='https://hub.docker.com/v2/repositories/brokenbadger/psio-gm/tags?page_size=100'
          while [ -n "${url}" ] && [ "$url" != "null" ]; do
            body=$(curl -fsS -H "Authorization: JWT $jwt" "$url")
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              [ "$name" = "stable" ] && continue
              echo "Deleting ${name}"
              curl -fsS -X DELETE -H "Authorization: JWT $jwt" \
                "https://hub.docker.com/v2/repositories/brokenbadger/psio-gm/tags/${name}/"
            done < <(jq -r '.results[].name' <<<"$body")
            url=$(jq -r '.next // empty' <<<"$body")
          done
